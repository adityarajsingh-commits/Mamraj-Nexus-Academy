<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | MamRaj Nexus Academy</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#faf6f1;
    font-family:Arial,sans-serif;
    color:#1d2d67;
}

.login-box{
    width:420px;
    max-width:92%;
    background:#fff;
    border:1px solid #e8e2dc;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 50px rgba(20,30,70,.08);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:170px;
    height:75px;
    object-fit:contain;
}

h1{
    text-align:center;
    font-size:24px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#7c8497;
    font-size:13px;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #ddd7d2;
    border-radius:9px;
    margin-bottom:12px;
    outline:none;
}

.input:focus{
    border-color:#c98b70;
}

.login-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#1d2d67;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.google-btn{
    width:100%;
    padding:13px;
    border:1px solid #ddd7d2;
    border-radius:9px;
    background:#fff;
    color:#1d2d67;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.divider{
    text-align:center;
    color:#999;
    font-size:11px;
    margin:18px 0;
}

.message{
    text-align:center;
    font-size:12px;
    margin-top:15px;
    color:#d05c4b;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img src="mamraj-logo.png">
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Sign in to continue your learning journey.
    </p>

    <input
        id="email"
        class="input"
        type="email"
        placeholder="Email address"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="Password"
    >

    <button class="login-btn" onclick="emailLogin()">
        Sign In
    </button>

    <div class="divider">
        OR
    </div>

    <button class="google-btn" onclick="googleLogin()">
        Continue with Google
    </button>

    <p id="message" class="message"></p>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* EMAIL LOGIN */

window.emailLogin = async function(){

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        window.location.href =
            "dashboard.html";

    }

    catch(error){

        message.textContent =
            "Invalid email or password.";

        console.error(error);

    }

}


/* GOOGLE LOGIN */

window.googleLogin = async function(){

    const provider =
        new GoogleAuthProvider();

    const message =
        document.getElementById("message");


    try{

        await signInWithPopup(
            auth,
            provider
        );

        window.location.href =
            "dashboard.html";

    }

    catch(error){

        message.textContent =
            "Google sign-in failed. Please try again.";

        console.error(error);

    }

}

</script>

</body>
</html>
