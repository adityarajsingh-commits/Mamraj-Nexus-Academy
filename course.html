    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }


        :root{

            --navy:#1e2a5a;

            --navy-dark:#151f49;

            --rose:#c58b73;

            --rose-light:#f5e8e1;

            --cream:#f8f3ee;

            --white:#ffffff;

            --text:#26304f;

            --muted:#747b91;

            --border:#e8e5e1;

            --success:#23845b;

            --shadow:
                0 15px 50px rgba(30,42,90,.08);

        }


        body{

            font-family:
                "Poppins",
                sans-serif;

            background:
                var(--cream);

            color:
                var(--text);

            min-height:
                100vh;

        }


        button,
        input{

            font-family:
                inherit;

        }


        button{

            cursor:pointer;

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar{

            height:72px;

            background:
                var(--white);

            border-bottom:
                1px solid var(--border);

            display:flex;

            align-items:center;

            justify-content:space-between;

            padding:
                0 30px;

            position:
                sticky;

            top:0;

            z-index:100;

        }


        .brand{

            display:flex;

            align-items:center;

            gap:12px;

            text-decoration:none;

            color:
                var(--navy);

            font-weight:800;

            font-size:18px;

        }


        .brand-mark{

            width:40px;

            height:40px;

            border-radius:12px;

            background:
                linear-gradient(
                    135deg,
                    var(--navy),
                    var(--rose)
                );

            color:white;

            display:flex;

            align-items:center;

            justify-content:center;

            font-weight:800;

        }


        .top-actions{

            display:flex;

            align-items:center;

            gap:10px;

        }


        .back-btn{

            border:1px solid var(--border);

            background:white;

            color:var(--navy);

            padding:
                9px 15px;

            border-radius:10px;

            font-weight:600;

        }


        .back-btn:hover{

            background:
                var(--rose-light);

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page{

            display:grid;

            grid-template-columns:
                310px minmax(0,1fr);

            min-height:
                calc(100vh - 72px);

        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar{

            background:
                var(--white);

            border-right:
                1px solid var(--border);

            padding:25px 18px;

            position:
                sticky;

            top:72px;

            height:
                calc(100vh - 72px);

            overflow-y:auto;

        }


        .course-mini{

            padding:
                10px 12px 20px;

            border-bottom:
                1px solid var(--border);

            margin-bottom:15px;

        }


        .course-mini small{

            color:
                var(--rose);

            font-size:9px;

            font-weight:800;

            letter-spacing:1.5px;

        }


        .course-mini h2{

            color:
                var(--navy);

            font-size:18px;

            line-height:1.35;

            margin-top:5px;

        }


        .progress-wrap{

            margin-top:15px;

        }


        .progress-info{

            display:flex;

            justify-content:space-between;

            font-size:10px;

            color:var(--muted);

            margin-bottom:7px;

        }


        .progress-bar{

            width:100%;

            height:7px;

            background:#eeeae6;

            border-radius:20px;

            overflow:hidden;

        }


        .progress-fill{

            height:100%;

            width:0%;

            background:
                linear-gradient(
                    90deg,
                    var(--navy),
                    var(--rose)
                );

            border-radius:20px;

            transition:
                width .3s ease;

        }


        .lesson-list{

            display:flex;

            flex-direction:column;

            gap:6px;

        }


        .lesson{

            width:100%;

            border:0;

            background:transparent;

            text-align:left;

            padding:
                12px;

            border-radius:11px;

            display:flex;

            align-items:center;

            gap:11px;

            color:
                var(--text);

            transition:.2s;

        }


        .lesson:hover{

            background:
                var(--cream);

        }


        .lesson.active{

            background:
                var(--rose-light);

            color:
                var(--navy);

        }


        .lesson.completed{

            color:
                var(--success);

        }


        .lesson-number{

            min-width:28px;

            height:28px;

            border-radius:8px;

            background:
                #f0eeeb;

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:10px;

            font-weight:800;

        }


        .lesson.active
        .lesson-number{

            background:
                var(--navy);

            color:white;

        }


        .lesson.completed
        .lesson-number{

            background:
                #e3f3eb;

            color:
                var(--success);

        }


        .lesson-title{

            font-size:11px;

            font-weight:600;

            line-height:1.35;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main{

            padding:
                35px;

            max-width:
                1100px;

            width:100%;

            margin:auto;

        }


        .course-header{

            background:
                var(--white);

            border:
                1px solid var(--border);

            border-radius:20px;

            padding:
                28px;

            box-shadow:
                var(--shadow);

            margin-bottom:22px;

        }


        .eyebrow{

            color:
                var(--rose);

            font-size:10px;

            letter-spacing:2px;

            font-weight:800;

        }


        .course-header h1{

            color:
                var(--navy);

            font-size:
                clamp(25px,4vw,38px);

            line-height:1.2;

            margin:
                7px 0 10px;

        }


        .course-description{

            color:
                var(--muted);

            font-size:13px;

            line-height:1.8;

            max-width:800px;

        }


        .meta{

            display:flex;

            flex-wrap:wrap;

            gap:10px;

            margin-top:18px;

        }


        .meta span{

            padding:
                7px 11px;

            background:
                var(--cream);

            border-radius:8px;

            color:
                var(--navy);

            font-size:10px;

            font-weight:600;

        }


        /* =====================================================
           LESSON AREA
        ===================================================== */

        .lesson-card{

            background:
                var(--white);

            border:
                1px solid var(--border);

            border-radius:20px;

            box-shadow:
                var(--shadow);

            overflow:hidden;

        }


        .lesson-top{

            padding:
                25px 28px;

            border-bottom:
                1px solid var(--border);

        }


        .lesson-top small{

            color:
                var(--rose);

            font-size:9px;

            font-weight:800;

            letter-spacing:1.5px;

        }


        .lesson-top h2{

            color:
                var(--navy);

            font-size:
                clamp(20px,3vw,28px);

            margin-top:5px;

        }


        .lesson-content{

            padding:
                28px;

            min-height:400px;

        }


        .lesson-content h3{

            color:
                var(--navy);

            margin:
                22px 0 10px;

            font-size:19px;

        }


        .lesson-content h3:first-child{

            margin-top:0;

        }


        .lesson-content p{

            color:
                #596078;

            font-size:13px;

            line-height:1.9;

            margin-bottom:13px;

        }


        .lesson-content ul{

            padding-left:20px;

            color:#596078;

            font-size:13px;

            line-height:2;

        }


        .code-box{

            background:
                #151b32;

            color:#f4f6ff;

            padding:20px;

            border-radius:12px;

            margin:20px 0;

            overflow-x:auto;

            font-family:
                Consolas,
                monospace;

            font-size:12px;

            line-height:1.7;

        }


        .tip{

            padding:16px;

            border-left:
                4px solid var(--rose);

            background:
                var(--rose-light);

            border-radius:8px;

            margin-top:20px;

            color:
                var(--navy);

            font-size:12px;

            line-height:1.7;

        }


        /* =====================================================
           ACTIONS
        ===================================================== */

        .lesson-actions{

            display:flex;

            justify-content:space-between;

            gap:12px;

            padding:
                20px 28px;

            border-top:
                1px solid var(--border);

            background:
                #fcfbfa;

        }


        .action-btn{

            border:1px solid var(--border);

            background:white;

            color:
                var(--navy);

            padding:
                11px 17px;

            border-radius:10px;

            font-size:11px;

            font-weight:700;

        }


        .action-btn.primary{

            background:
                var(--navy);

            color:white;

            border-color:
                var(--navy);

        }


        .action-btn.complete{

            background:
                var(--success);

            color:white;

            border-color:
                var(--success);

        }


        .action-btn:disabled{

            opacity:.45;

            cursor:not-allowed;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading{

            position:fixed;

            inset:0;

            background:
                rgba(248,243,238,.96);

            z-index:999;

            display:flex;

            align-items:center;

            justify-content:center;

            flex-direction:column;

            gap:12px;

        }


        .spinner{

            width:35px;

            height:35px;

            border:
                3px solid #ddd;

            border-top-color:
                var(--navy);

            border-radius:50%;

            animation:
                spin .7s linear infinite;

        }


        @keyframes spin{

            to{
                transform:rotate(360deg);
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:850px){

            .page{

                grid-template-columns:1fr;

            }


            .sidebar{

                position:relative;

                top:0;

                height:auto;

                border-right:0;

                border-bottom:
                    1px solid var(--border);

            }


            .lesson-list{

                display:grid;

                grid-template-columns:
                    repeat(2,1fr);

            }


            .main{

                padding:20px 15px;

            }

        }


        @media(max-width:550px){

            .topbar{

                padding:
                    0 15px;

            }


            .brand{

                font-size:14px;

            }


            .brand-mark{

                width:34px;

                height:34px;

            }


            .back-btn{

                font-size:10px;

                padding:
                    8px 10px;

            }


            .course-header{

                padding:20px;

            }


            .lesson-content{

                padding:20px;

            }


            .lesson-actions{

                padding:
                    15px;

                flex-direction:column;

            }


            .action-btn{

                width:100%;

            }


            .lesson-list{

                grid-template-columns:1fr;

            }

        }

    </style>

</head>

    </main>

/* =====================================================
   URL COURSE ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const courseId =
    params.get("id") ||
    "web-development";


/* =====================================================
   CURRENT COURSE
===================================================== */

const course =
    courses[courseId] ||
    courses["web-development"];


let currentLesson = 0;

let completedLessons = new Set();

let currentUser = null;



/* =====================================================
   ELEMENTS
===================================================== */

const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );

const courseTitle =
    document.getElementById(
        "courseTitle"
    );

const courseDescription =
    document.getElementById(
        "courseDescription"
    );

const courseLevel =
    document.getElementById(
        "courseLevel"
    );

const courseLessons =
    document.getElementById(
        "courseLessons"
    );

const sideCourseTitle =
    document.getElementById(
        "sideCourseTitle"
    );

const lessonList =
    document.getElementById(
        "lessonList"
    );

const lessonNumber =
    document.getElementById(
        "lessonNumber"
    );

const lessonTitle =
    document.getElementById(
        "lessonTitle"
    );

const lessonContent =
    document.getElementById(
        "lessonContent"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const previousBtn =
    document.getElementById(
        "previousBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const completeBtn =
    document.getElementById(
        "completeBtn"
    );



/* =====================================================
   COURSE HEADER
===================================================== */

courseTitle.textContent =
    course.title;

sideCourseTitle.textContent =
    course.title;

courseDescription.textContent =
    course.description;

courseLevel.textContent =
    course.level;

courseLessons.textContent =
    course.lessons.length +
    " Lessons";



/* =====================================================
   RENDER LESSON LIST
===================================================== */

function renderLessonList(){

    lessonList.innerHTML = "";


    course.lessons.forEach(
        (lesson,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "lesson";


            if(index === currentLesson){

                button.classList.add(
                    "active"
                );

            }


            if(
                completedLessons.has(
                    index
                )
            ){

                button.classList.add(
                    "completed"
                );

            }


            button.innerHTML = `

                <span class="lesson-number">

                    ${
                        completedLessons.has(index)
                        ? "✓"
                        : String(index + 1).padStart(2,"0")
                    }

                </span>

                <span class="lesson-title">

                    ${lesson.title}

                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    currentLesson =
                        index;

                    renderLesson();

                }
            );


            lessonList.appendChild(
                button
            );

        }
    );

}



/* =====================================================
   RENDER CURRENT LESSON
===================================================== */

function renderLesson(){

    const lesson =
        course.lessons[
            currentLesson
        ];


    if(!lesson){

        return;

    }


    lessonNumber.textContent =
        "LESSON " +
        String(
            currentLesson + 1
        ).padStart(2,"0");


    lessonTitle.textContent =
        lesson.title;


    lessonContent.innerHTML =
        lesson.content;


    previousBtn.disabled =
        currentLesson === 0;


    nextBtn.disabled =
        currentLesson ===
        course.lessons.length - 1;


    if(
        completedLessons.has(
            currentLesson
        )
    ){

        completeBtn.textContent =
            "Completed ✓";

        completeBtn.classList.add(
            "complete"
        );

    }else{

        completeBtn.textContent =
            "Mark as Complete ✓";

        completeBtn.classList.remove(
            "complete"
        );

    }


    renderLessonList();

    updateProgress();

}



/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

    const total =
        course.lessons.length;


    const completed =
        completedLessons.size;


    const percent =
        total
        ? Math.round(
            (completed / total) * 100
        )
        : 0;


    progressFill.style.width =
        percent + "%";


    progressText.textContent =
        percent + "%";

}



/* =====================================================
   SAVE PROGRESS
===================================================== */

async function saveProgress(){

    if(!currentUser){

        return;

    }


    try{

        const completed =
            Array.from(
                completedLessons
            );


        const progress =
            course.lessons.length
            ? Math.round(
                (
                    completed.length /
                    course.lessons.length
                ) * 100
            )
            : 0;


        const enrollmentRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "enrolledCourses",
                courseId
            );


        await setDoc(
            enrollmentRef,
            {

                courseId:
                    courseId,

                courseTitle:
                    course.title,

                progress:
                    progress,

                currentLesson:
                    currentLesson,

                completedLessons:
                    completed,

                completed:
                    progress >= 100,

                lastAccessed:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        console.log(
            "Progress saved:",
            progress + "%"
        );


    }catch(error){

        console.error(
            "Progress save error:",
            error
        );

    }

}



/* =====================================================
   LOAD PROGRESS
===================================================== */

async function loadProgress(){

    if(!currentUser){

        return;

    }


    try{

        const enrollmentRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "enrolledCourses",
                courseId
            );


        const snapshot =
            await getDoc(
                enrollmentRef
            );


        if(
            snapshot.exists()
        ){

            const data =
                snapshot.data();


            if(
                Array.isArray(
                    data.completedLessons
                )
            ){

                completedLessons =
                    new Set(
                        data.completedLessons
                    );

            }


            if(
                typeof data.currentLesson ===
                "number"
            ){

                currentLesson =
                    Math.min(
                        data.currentLesson,
                        course.lessons.length - 1
                    );

            }

        }


    }catch(error){

        console.error(
            "Progress loading error:",
            error
        );

    }

}



/* =====================================================
   MARK COMPLETE
===================================================== */

completeBtn.addEventListener(
    "click",
    async function(){

        completedLessons.add(
            currentLesson
        );


        updateProgress();

        renderLessonList();


        await saveProgress();


        // Automatically move to next lesson

        if(
            currentLesson <
            course.lessons.length - 1
        ){

            setTimeout(
                () => {

                    currentLesson++;

                    renderLesson();

                },
                350
            );

        }

    }
);



/* =====================================================
   PREVIOUS
===================================================== */

previousBtn.addEventListener(
    "click",
    function(){

        if(
            currentLesson > 0
        ){

            currentLesson--;

            renderLesson();

        }

    }
);



/* =====================================================
   NEXT
===================================================== */

nextBtn.addEventListener(
    "click",
    async function(){

        if(
            currentLesson <
            course.lessons.length - 1
        ){

            currentLesson++;

            renderLesson();

            await saveProgress();

        }

    }
);



/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.replace(
                "login.html"
            );

            return;

        }


        currentUser =
            user;


        try{

            await loadProgress();

            renderLesson();

        }catch(error){

            console.error(error);

            renderLesson();

        }


        loadingScreen.style.display =
            "none";

    },

    function(error){

        console.error(
            "Authentication error:",
            error
        );


        window.location.replace(
            "login.html"
        );

    }
);

</script>
